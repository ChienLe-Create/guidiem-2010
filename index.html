<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gửi Diễm ❤️</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: radial-gradient(circle at 50% 50%, #2b0a1a, #0d0208);
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            position: relative;
        }

        /* ============================================================
           HIỆU ỨNG NỀN: SAO LẤP LÁNH
           ============================================================ */
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle 2s infinite ease-in-out;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.2; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.3); }
        }

        /* ============================================================
           MÀN HÌNH KHÓA
           ============================================================ */
        #lockScreen {
            text-align: center;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            padding: 50px 70px;
            border-radius: 25px;
            border: 1px solid rgba(255, 179, 198, 0.3);
            box-shadow: 0 0 60px rgba(255, 77, 109, 0.4),
                        inset 0 0 30px rgba(255, 179, 198, 0.1);
            z-index: 100;
            animation: fadeInScale 1s ease-out;
        }

        @keyframes fadeInScale {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }

        #lockScreen h2 {
            color: #ffb3c6;
            margin-bottom: 25px;
            font-size: 1.8rem;
            text-shadow: 0 0 20px rgba(255, 179, 198, 0.8);
            animation: glow 2s infinite alternate;
        }

        @keyframes glow {
            from { text-shadow: 0 0 10px rgba(255, 179, 198, 0.5); }
            to { text-shadow: 0 0 30px rgba(255, 77, 109, 1), 0 0 40px rgba(255, 77, 109, 0.5); }
        }

        #passwordInput {
            padding: 15px 25px;
            font-size: 1.2rem;
            border: 2px solid rgba(255, 179, 198, 0.5);
            border-radius: 12px;
            outline: none;
            width: 320px;
            text-align: center;
            color: #fff;
            background: rgba(0, 0, 0, 0.3);
            transition: all 0.3s;
        }

        #passwordInput::placeholder { color: rgba(255, 255, 255, 0.4); }

        #passwordInput:focus {
            border-color: #ff4d6d;
            box-shadow: 0 0 25px rgba(255, 77, 109, 0.8);
            background: rgba(0, 0, 0, 0.5);
        }

        #unlockBtn {
            display: block;
            margin: 25px auto 0;
            padding: 14px 50px;
            font-size: 1.2rem;
            background: linear-gradient(135deg, #ff4d6d, #b30000);
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 0 20px rgba(255, 77, 109, 0.6);
            font-weight: bold;
            letter-spacing: 2px;
        }

        #unlockBtn:hover {
            transform: scale(1.08);
            box-shadow: 0 0 40px rgba(255, 77, 109, 1);
        }

        #errorMsg {
            color: #ff4d6d;
            margin-top: 15px;
            font-size: 1rem;
            height: 20px;
            text-shadow: 0 0 10px rgba(255, 77, 109, 0.8);
        }

        /* ============================================================
           NỘI DUNG CHÍNH
           ============================================================ */
        #mainContent {
            display: none;
            text-align: center;
            z-index: 10;
            position: relative;
        }

        .heart-wrapper {
            position: relative;
            display: inline-block;
        }

        .heart-wrapper::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 400px;
            height: 400px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 77, 109, 0.4), transparent 70%);
            animation: pulse 2s infinite ease-in-out;
            z-index: -1;
        }

        @keyframes pulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.5; }
            50% { transform: translate(-50%, -50%) scale(1.2); opacity: 0.9; }
        }

        canvas {
            display: block;
            margin: 0 auto;
            animation: beat 1.2s infinite ease-in-out;
            filter: drop-shadow(0 0 30px rgba(255, 77, 109, 0.8));
        }

        @keyframes beat {
            0% { transform: scale(1); }
            30% { transform: scale(1.12); }
            60% { transform: scale(1); }
            80% { transform: scale(1.06); }
            100% { transform: scale(1); }
        }

        .message {
            font-size: 2.8rem;
            color: #ff4d6d;
            margin-top: 25px;
            text-shadow: 0 0 20px rgba(255, 77, 109, 0.9),
                         0 0 40px rgba(255, 77, 109, 0.5);
            font-weight: bold;
            letter-spacing: 3px;
            animation: fadeInUp 2s ease-out, glow 3s infinite alternate;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .sub-message {
            font-size: 1.6rem;
            color: #ffb3c6;
            margin-top: 15px;
            letter-spacing: 5px;
            text-shadow: 0 0 15px rgba(255, 179, 198, 0.8);
            animation: fadeInUp 3s ease-out;
        }

        /* ============================================================
           HIỆU ỨNG TRÁI TIM BAY
           ============================================================ */
        .heart-float {
            position: absolute;
            bottom: -50px;
            color: #ff4d6d;
            font-size: 24px;
            animation: floatUp 4s linear infinite;
            opacity: 0;
            pointer-events: none;
            z-index: 5;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) rotate(0deg) scale(1); opacity: 1; }
            100% { transform: translateY(-110vh) rotate(360deg) scale(0.5); opacity: 0; }
        }

        /* ============================================================
           HIỆU ỨNG TIA SÁNG
           ============================================================ */
        .light-ray {
            position: fixed;
            top: 50%;
            left: 50%;
            width: 2px;
            height: 200vh;
            background: linear-gradient(transparent, rgba(255, 77, 109, 0.6), transparent);
            transform-origin: center;
            pointer-events: none;
            z-index: 2;
        }

        /* ============================================================
           HIỆU ỨNG PHÁO HOA
           ============================================================ */
        .firework-particle {
            position: absolute;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <!-- Sao nền -->
    <div class="stars" id="stars"></div>

    <!-- Màn hình khóa -->
    <div id="lockScreen">
        <h2>🔒 Nhập mật khẩu để mở</h2>
        <input type="password" id="passwordInput" placeholder="Nhập mật khẩu..." autofocus>
        <button id="unlockBtn">Mở khóa</button>
        <div id="errorMsg"></div>
    </div>

    <!-- Nội dung chính -->
    <div id="mainContent">
        <div class="heart-wrapper">
            <canvas id="heartCanvas" width="350" height="350"></canvas>
        </div>
        <div class="message">Anh Yêu Diễm Nhiều Lắm Ạ</div>
        <div class="sub-message">❤️ 20/10 ❤️</div>
    </div>

    <script>
        // ============================================================
        // TẠO SAO NỀN
        // ============================================================
        const starsContainer = document.getElementById('stars');
        for (let i = 0; i < 120; i++) {
            const star = document.createElement('div');
            star.classList.add('star');
            const size = Math.random() * 3 + 1;
            star.style.width = size + 'px';
            star.style.height = size + 'px';
            star.style.left = Math.random() * 100 + 'vw';
            star.style.top = Math.random() * 100 + 'vh';
            star.style.animationDelay = Math.random() * 2 + 's';
            star.style.animationDuration = (Math.random() * 2 + 1.5) + 's';
            starsContainer.appendChild(star);
        }

        // ============================================================
        // MẬT KHẨU
        // ============================================================
        const MAT_KHAU_DUNG = "1502";
        const lockScreen = document.getElementById('lockScreen');
        const mainContent = document.getElementById('mainContent');
        const passwordInput = document.getElementById('passwordInput');
        const unlockBtn = document.getElementById('unlockBtn');
        const errorMsg = document.getElementById('errorMsg');

        function kiemTraMatKhau() {
            if (passwordInput.value.trim() === MAT_KHAU_DUNG) {
                lockScreen.style.display = 'none';
                mainContent.style.display = 'block';
                drawHeart();
                setInterval(createHeart, 250);
                setInterval(createFirework, 1500);
                createLightRays();
            } else {
                errorMsg.textContent = "Mật khẩu không đúng, thử lại nhé!";
                passwordInput.value = '';
                passwordInput.focus();
                lockScreen.style.animation = 'shake 0.5s';
                setTimeout(() => { lockScreen.style.animation = 'fadeInScale 1s ease-out'; }, 500);
            }
        }

        unlockBtn.addEventListener('click', kiemTraMatKhau);
        passwordInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') kiemTraMatKhau();
        });

        // ============================================================
        // VẼ TRÁI TIM
        // ============================================================
        const canvas = document.getElementById('heartCanvas');
        const ctx = canvas.getContext('2d');
        const width = canvas.width;
        const height = canvas.height;
        const centerX = width / 2;
        const centerY = height / 2;

        function drawHeart() {
            ctx.clearRect(0, 0, width, height);
            ctx.beginPath();
            const scale = 11;
            for (let t = 0; t <= Math.PI * 2; t += 0.01) {
                const x = 16 * Math.pow(Math.sin(t), 3);
                const y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
                const px = centerX + x * scale;
                const py = centerY - y * scale;
                if (t === 0) ctx.moveTo(px, py);
                else ctx.lineTo(px, py);
            }
            ctx.closePath();
            const gradient = ctx.createRadialGradient(centerX, centerY - 20, 10, centerX, centerY, 180);
            gradient.addColorStop(0, '#ff8fa3');
            gradient.addColorStop(0.3, '#ff4d6d');
            gradient.addColorStop(0.7, '#c9184a');
            gradient.addColorStop(1, '#800020');
            ctx.fillStyle = gradient;
            ctx.fill();
            ctx.strokeStyle = '#ffb3c6';
            ctx.lineWidth = 4;
            ctx.stroke();

            ctx.beginPath();
            ctx.ellipse(centerX - 60, centerY - 60, 25, 15, -0.5, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
            ctx.fill();
        }

        // ============================================================
        // TRÁI TIM BAY
        // ============================================================
        const heartIcons = ['❤️', '💕', '💖', '💗', '💓', '🌸', '✨'];
        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart-float');
            heart.innerHTML = heartIcons[Math.floor(Math.random() * heartIcons.length)];
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = (Math.random() * 2 + 3) + 's';
            heart.style.fontSize = (Math.random() * 25 + 15) + 'px';
            document.body.appendChild(heart);
            setTimeout(() => heart.remove(), 5000);
        }

        // ============================================================
        // TIA SÁNG
        // ============================================================
        function createLightRays() {
            for (let i = 0; i < 8; i++) {
                const ray = document.createElement('div');
                ray.classList.add('light-ray');
                ray.style.transform = `translate(-50%, -50%) rotate(${i * 45}deg)`;
                ray.style.animation = `rayRotate ${8 + i}s linear infinite`;
                document.body.appendChild(ray);
            }
        }

        const styleSheet = document.createElement('style');
        styleSheet.textContent = `
            @keyframes rayRotate {
                from { transform: translate(-50%, -50%) rotate(0deg); }
                to { transform: translate(-50%, -50%) rotate(360deg); }
            }
            @keyframes shake {
                0%, 100% { transform: translateX(0); }
                25% { transform: translateX(-10px); }
                75% { transform: translateX(10px); }
            }
        `;
        document.head.appendChild(styleSheet);

        // ============================================================
        // PHÁO HOA
        // ============================================================
        const fireworkColors = ['#ff4d6d', '#ffb3c6', '#ff8fa3', '#ffd700', '#ff69b4', '#ff1493'];
        function createFirework() {
            const cx = Math.random() * window.innerWidth;
            const cy = Math.random() * window.innerHeight * 0.6;
            const color = fireworkColors[Math.floor(Math.random() * fireworkColors.length)];
            const soLuong = 20;

            for (let i = 0; i < soLuong; i++) {
                const particle = document.createElement('div');
                particle.classList.add('firework-particle');
                particle.style.left = cx + 'px';
                particle.style.top = cy + 'px';
                particle.style.background = color;
                particle.style.boxShadow = `0 0 10px ${color}`;
                document.body.appendChild(particle);

                const angle = (Math.PI * 2 * i) / soLuong;
                const distance = 60 + Math.random() * 60;
                const dx = Math.cos(angle) * distance;
                const dy = Math.sin(angle) * distance;

                particle.animate([
                    { transform: 'translate(0, 0) scale(1)', opacity: 1 },
                    { transform: `translate(${dx}px, ${dy}px) scale(0)`, opacity: 0 }
                ], {
                    duration: 1000 + Math.random() * 500,
                    easing: 'cubic-bezier(0, 0.9, 0.57, 1)'
                });

                setTimeout(() => particle.remove(), 1500);
            }
        }

        // ============================================================
        // ĐỔI MÀU NỀN ĐỘNG
        // ============================================================
        let hue = 340;
        setInterval(() => {
            if (mainContent.style.display === 'block') {
                hue = (hue + 1) % 360;
                document.body.style.background = `radial-gradient(circle at 50% 50%, hsl(${hue}, 60%, 10%), #0d0208)`;
            }
        }, 100);
    </script>
</body>
</html>
