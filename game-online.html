<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NSMOD - Pong Online P2P</title>
    <style>
        /* CSS co ban */
        body {
            margin: 0;
            background: #111;
            color: #0f0;
            font-family: monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            touch-action: none; /* Chan cuon trang tren dien thoai */
        }
        #lobby {
            text-align: center;
            padding: 20px;
        }
        #lobby input, #lobby button {
            font-family: monospace;
            font-size: 16px;
            padding: 8px;
            margin: 5px;
            background: #222;
            color: #0f0;
            border: 1px solid #0f0;
        }
        #lobby button:hover {
            background: #0f0;
            color: #111;
            cursor: pointer;
        }
        #game-container {
            display: none;
            position: relative;
        }
        canvas {
            border: 2px solid #0f0;
            background: #000;
            max-width: 100vw;
            max-height: 80vh;
            object-fit: contain;
        }
        #status {
            margin-top: 10px;
            font-size: 14px;
            color: #0f0;
        }
        #mobile-controls {
            display: none;
            margin-top: 15px;
            gap: 30px;
        }
        .ctrl-btn {
            width: 80px;
            height: 80px;
            background: #222;
            color: #0f0;
            border: 2px solid #0f0;
            font-size: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        .ctrl-btn:active {
            background: #0f0;
            color: #111;
        }
        /* Hien thi nut dieu huong tren man hinh nho */
        @media (max-width: 900px) {
            #mobile-controls {
                display: flex;
            }
        }
    </style>
</head>
<body>
    <div id="lobby">
        <h1>NSMOD PONG ONLINE</h1>
        <p>Choi 2 nguoi qua Internet (P2P)</p>
        <div>
            <button id="btnCreate">Tao phong</button>
            <input id="roomIdInput" placeholder="Nhap ID phong" />
            <button id="btnJoin">Tham gia</button>
        </div>
        <div id="status">Chua ket noi</div>
    </div>
    <div id="game-container">
        <canvas id="canvas" width="800" height="600"></canvas>
    </div>
    <div id="mobile-controls">
        <div class="ctrl-btn" id="btnUp">▲</div>
        <div class="ctrl-btn" id="btnDown">▼</div>
    </div>

    <!-- PeerJS CDN -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script>
        // ============================================================
        // GAME PONG ONLINE P2P SU DUNG PEERJS
        // Tac gia: NSMOD
        // Ho tro ca ban phim va cam ung
        // ============================================================

        // Lay cac phan tu DOM
        const lobby = document.getElementById('lobby');
        const gameContainer = document.getElementById('game-container');
        const statusDiv = document.getElementById('status');
        const btnCreate = document.getElementById('btnCreate');
        const btnJoin = document.getElementById('btnJoin');
        const roomIdInput = document.getElementById('roomIdInput');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        // Kich thuoc game
        const WIDTH = 800;
        const HEIGHT = 600;
        const PADDLE_W = 15;
        const PADDLE_H = 100;
        const BALL_SIZE = 15;

        // Bien toan cuc
        let peer = null;
        let conn = null;
        let isHost = false;
        let gameRunning = false;

        // Trang thai game
        let ballX = WIDTH / 2;
        let ballY = HEIGHT / 2;
        let ballDX = 5;
        let ballDY = 5;
        let hostPaddleY = 250;
        let guestPaddleY = 250;
        let scoreHost = 0;
        let scoreGuest = 0;

        // Dieu khien paddle cua ban than
        let myPaddleY = 250;
        let upPressed = false;
        let downPressed = false;

        // ==================== KHOI TAO PEER ====================
        function initPeer(id) {
            peer = new Peer(id, { debug: 2 });

            peer.on('open', (myId) => {
                if (isHost) {
                    statusDiv.textContent = 'Phong da tao. ID: ' + myId + ' - Cho nguoi choi khac...';
                } else {
                    statusDiv.textContent = 'Dang ket noi den phong...';
                }
            });

            peer.on('error', (err) => {
                statusDiv.textContent = 'Loi: ' + err.message;
            });

            peer.on('connection', (connection) => {
                if (!isHost) return;
                if (conn) {
                    connection.close();
                    return;
                }
                conn = connection;
                setupConnection();
                statusDiv.textContent = 'Da co nguoi choi ket noi! Bat dau game.';
                startGame();
            });
        }

        // ==================== THIET LAP KET NOI ====================
        function setupConnection() {
            conn.on('open', () => {
                if (isHost) sendGameState();
            });

            conn.on('data', (data) => {
                if (isHost) {
                    if (data.type === 'paddle') guestPaddleY = data.y;
                } else {
                    if (data.type === 'state') {
                        ballX = data.ballX;
                        ballY = data.ballY;
                        hostPaddleY = data.hostPaddleY;
                        guestPaddleY = data.guestPaddleY;
                        scoreHost = data.scoreHost;
                        scoreGuest = data.scoreGuest;
                    }
                }
            });

            conn.on('close', () => {
                statusDiv.textContent = 'Ket noi da dong.';
                gameRunning = false;
            });
        }

        // ==================== GUI DU LIEU ====================
        function sendGameState() {
            if (!conn || !conn.open || !isHost) return;
            conn.send({
                type: 'state',
                ballX: ballX, ballY: ballY,
                hostPaddleY: hostPaddleY, guestPaddleY: guestPaddleY,
                scoreHost: scoreHost, scoreGuest: scoreGuest
            });
        }

        function sendPaddle() {
            if (!conn || !conn.open) return;
            conn.send({ type: 'paddle', y: myPaddleY });
        }

        // ==================== VONG LAP GAME ====================
        function gameLoop() {
            if (!gameRunning) return;

            // Cap nhat paddle cua ban than
            if (upPressed) myPaddleY -= 7;
            if (downPressed) myPaddleY += 7;
            myPaddleY = Math.max(0, Math.min(HEIGHT - PADDLE_H, myPaddleY));

            if (isHost) {
                hostPaddleY = myPaddleY;
                ballX += ballDX;
                ballY += ballDY;

                if (ballY <= 0 || ballY >= HEIGHT - BALL_SIZE) ballDY *= -1;

                if (ballX <= 30 + PADDLE_W) {
                    if (ballY + BALL_SIZE >= hostPaddleY && ballY <= hostPaddleY + PADDLE_H) {
                        ballDX *= -1.05;
                    } else if (ballX <= 0) {
                        scoreGuest++;
                        resetBall();
                    }
                }

                if (ballX >= WIDTH - 30 - PADDLE_W - BALL_SIZE) {
                    if (ballY + BALL_SIZE >= guestPaddleY && ballY <= guestPaddleY + PADDLE_H) {
                        ballDX *= -1.05;
                    } else if (ballX >= WIDTH) {
                        scoreHost++;
                        resetBall();
                    }
                }
                sendGameState();
            } else {
                guestPaddleY = myPaddleY;
                sendPaddle();
            }

            draw();
            requestAnimationFrame(gameLoop);
        }

        function resetBall() {
            ballX = WIDTH / 2;
            ballY = HEIGHT / 2;
            ballDX = ballDX > 0 ? 5 : -5;
            ballDY = 5;
        }

        function draw() {
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, WIDTH, HEIGHT);

            ctx.strokeStyle = '#333';
            ctx.setLineDash([10, 10]);
            ctx.beginPath();
            ctx.moveTo(WIDTH / 2, 0);
            ctx.lineTo(WIDTH / 2, HEIGHT);
            ctx.stroke();
            ctx.setLineDash([]);

            ctx.fillStyle = '#0f0';
            ctx.fillRect(30, hostPaddleY, PADDLE_W, PADDLE_H);

            ctx.fillStyle = '#f44';
            ctx.fillRect(WIDTH - 30 - PADDLE_W, guestPaddleY, PADDLE_W, PADDLE_H);

            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(ballX + BALL_SIZE/2, ballY + BALL_SIZE/2, BALL_SIZE/2, 0, Math.PI * 2);
            ctx.fill();

            ctx.font = '36px monospace';
            ctx.fillStyle = '#0f0';
            ctx.fillText(scoreHost, WIDTH / 2 - 80, 50);
            ctx.fillStyle = '#f44';
            ctx.fillText(scoreGuest, WIDTH / 2 + 50, 50);
        }

        // ==================== BAT DAU GAME ====================
        function startGame() {
            lobby.style.display = 'none';
            gameContainer.style.display = 'block';
            gameRunning = true;
            ballX = WIDTH / 2;
            ballY = HEIGHT / 2;
            ballDX = 5;
            ballDY = 5;
            hostPaddleY = 250;
            guestPaddleY = 250;
            scoreHost = 0;
            scoreGuest = 0;
            myPaddleY = 250;
            requestAnimationFrame(gameLoop);
        }

        // ==================== SU KIEN BAN PHIM ====================
        window.addEventListener('keydown', (e) => {
            if (e.key === 'w' || e.key === 'W') upPressed = true;
            if (e.key === 's' || e.key === 'S') downPressed = true;
            if (e.key === 'ArrowUp') upPressed = true;
            if (e.key === 'ArrowDown') downPressed = true;
        });

        window.addEventListener('keyup', (e) => {
            if (e.key === 'w' || e.key === 'W') upPressed = false;
            if (e.key === 's' || e.key === 'S') downPressed = false;
            if (e.key === 'ArrowUp') upPressed = false;
            if (e.key === 'ArrowDown') downPressed = false;
        });

        // ==================== SU KIEN CAM UNG ====================
        // Nut len
        document.getElementById('btnUp').addEventListener('touchstart', (e) => {
            e.preventDefault();
            upPressed = true;
        });
        document.getElementById('btnUp').addEventListener('touchend', (e) => {
            e.preventDefault();
            upPressed = false;
        });
        // Nut xuong
        document.getElementById('btnDown').addEventListener('touchstart', (e) => {
            e.preventDefault();
            downPressed = true;
        });
        document.getElementById('btnDown').addEventListener('touchend', (e) => {
            e.preventDefault();
            downPressed = false;
        });

        // Ho tro chuot cho nut cam ung (test tren may tinh)
        document.getElementById('btnUp').addEventListener('mousedown', () => upPressed = true);
        document.getElementById('btnUp').addEventListener('mouseup', () => upPressed = false);
        document.getElementById('btnDown').addEventListener('mousedown', () => downPressed = true);
        document.getElementById('btnDown').addEventListener('mouseup', () => downPressed = false);

        // ==================== SU KIEN LOBBY ====================
        btnCreate.addEventListener('click', () => {
            isHost = true;
            const randomId = 'nsmod-' + Math.random().toString(36).substr(2, 6);
            initPeer(randomId);
        });

        btnJoin.addEventListener('click', () => {
            const id = roomIdInput.value.trim();
            if (!id) {
                statusDiv.textContent = 'Vui long nhap ID phong.';
                return;
            }
            isHost = false;
            initPeer();
            peer.on('open', () => {
                conn = peer.connect(id);
                setupConnection();
                conn.on('open', () => {
                    statusDiv.textContent = 'Da ket noi! Bat dau game.';
                    startGame();
                });
            });
        });
    </script>
</body>
</html>
